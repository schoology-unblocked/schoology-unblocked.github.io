  <style>
    /* Iframe appearance */
    #gameframe{
      width:100%;
      height:62vh;
      max-width:1200px;
      display:block;
      margin:0 auto;
      border:2px solid #1e2c58;
      border-radius:10px;
      box-shadow:0 0 8px rgba(0,0,0,.4);
    }
    /* Overlay: centered cover + play */
    #overlay{
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:12px; z-index:5;
      pointer-events:auto;
    }
    .overlaybar{ position:absolute; top:10px; left:10px; right:10px;
      display:flex; justify-content:space-between; align-items:center; }
    .gname{ margin:0; font-size:18px; }
    .gamecover{ width:160px; aspect-ratio:1/1; object-fit:cover; border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.35); }
    /* Bottom control box */
    .control-box{ display:flex; gap:10px; justify-content:flex-end; align-items:center;
      padding:10px 0; margin-top:8px; max-width:1200px; margin-left:auto; margin-right:auto; }
    /* Fullscreen fallback */
    .player{ position:relative; }
    .player.is-fs{ position:fixed!important; inset:0!important; width:100vw!important; height:100vh!important;
      background:#0a1020; z-index:9999; border-radius:0!important; }
    .player.is-fs #gameframe{ width:100%!important; height:100%!important; }
    html.is-fs, body.is-fs{ overflow:hidden!important; }
  </style>
<style>
/* === Inline patch v2: cover/title centered, spacing, and bar gname hidden === */
#overlay .gamecover{ display:block; margin:-12px auto 10px auto; }
#overlay-gamename{ text-align:center; font-size:1.1rem; font-weight:700; color:#fff; margin-top:6px; }
#playbtn{ display:inline-block; margin-top:8px; margin-bottom:20px !important; }
#overlay .overlaybar #gname{ display:none !important; }
</style>
